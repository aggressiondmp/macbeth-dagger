<title>The Dagger and the Deed</title>
<style>
  :root{
    --ink:#07080A;
    --bone:#EDE9E1;
    --steel:#9FB6C2;
    --ash:#6E747A;
    --ash-dim:#2C3035;
    --blood:#B32013;
    --blood-lit:#D8402A;
    --taper:#C9A24A;
    --gold:#E3B85C;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:var(--serif);
    overflow:hidden;
  }

  .frame{position:relative;height:100vh;overflow:hidden}
  /* the lit room. painted rather than a static gradient, because a candle
     moves and a flat wash reads as a black panel */
  .atmos{position:absolute;inset:0;z-index:0;display:block}
  .frame::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:3;
    background:
      radial-gradient(100% 100% at 50% 46%, transparent 44%, rgba(0,0,0,.66) 100%);
  }
  .frame.hit{animation:hit .5s cubic-bezier(.2,.8,.3,1)}
  @keyframes hit{
    0%{transform:translate(0,0)}
    14%{transform:translate(-7px,3px)}
    32%{transform:translate(5px,-3px)}
    54%{transform:translate(-3px,-2px)}
    76%{transform:translate(2px,1px)}
    100%{transform:translate(0,0)}
  }

  /* ---- one fixed column. every line begins or ends on the same two edges,
         so the left/right split reads as a system, not as drift ---- */
  .stage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1120px,88vw);
    height:62vh;
    display:grid;
    align-content:center;
    z-index:2;
  }
  .plate{position:relative;transition:opacity .9s ease}
  /* the scene rests in its own silences rather than leaving dead text up */
  .plate.rest{opacity:0}

  .line{
    margin:0;
    color:var(--voice);
    font-size:var(--size);
    line-height:1.3;
    /* verse lineation is the point: a line never wraps, the type is fitted to it */
    white-space:nowrap;
    text-align:var(--align);
  }
  /* clones are absolutely positioned over their line, so they must not take the stack margin */
  .line + .line:not(.ghost):not(.echo){margin-top:.34em}
  /* each wrap is the positioning context for its own line's clones, so on a
     multi-line beat the copies sit over their own line and not over line one */
  .linewrap{position:relative}
  .linewrap + .linewrap{margin-top:.34em}
  .ch{display:inline-block;white-space:pre}
  .wd{display:inline-block}

  /* ---- the two voices. his is warm, wide and left-hung; hers is cold,
         tight and right-hung, and she is the only one never distorted ---- */
  .plate{--voice:var(--bone);--align:left;--size:44px}
  .plate.her{--voice:var(--steel);--align:right;letter-spacing:-.006em}
  /* the sound cues are their own channel: a brighter gold than the candle, and
     they no longer fade almost out - a marker has to be able to see them */
  .plate.sd{--voice:var(--gold);--align:center}
  .plate.sd .line{
    font-family:var(--mono);
    font-size:clamp(.8rem,2vw,1.08rem);
    letter-spacing:.42em;
    text-transform:uppercase;
  }

  /* ================= techniques =================
     each one has a single job, and the same job every time it appears */

  /* SETTLE - his composed voice. words are uncovered in reading order */
  .fx-settle .wd{animation:wipe .68s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*105ms)}
  @keyframes wipe{0%{clip-path:inset(-.28em 100% -.36em 0);opacity:0}62%{opacity:1}100%{clip-path:inset(-.28em -.15em -.36em 0);opacity:1}}
  @keyframes unwipe{from{clip-path:inset(-.28em -.15em -.36em 0)}to{clip-path:inset(-.28em -.15em -.36em 100%)}}

  /* RESOLVE - the vision arriving. the same wipe, slower, with a rise under it */
  .fx-resolve .wd{
    animation:wipe .82s cubic-bezier(.16,.84,.32,1) both, rise .82s cubic-bezier(.16,.84,.32,1) both;
    animation-delay:calc(var(--w)*150ms);
  }
  @keyframes rise{from{transform:translateY(.1em)}to{transform:none}}

  /* LOCK - hers. the wipe runs right to left, against his, and never wavers */
  .fx-lock .wd{animation:wipeback .6s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*95ms)}
  @keyframes wipeback{0%{clip-path:inset(-.28em 0 -.36em 100%);opacity:0}62%{opacity:1}100%{clip-path:inset(-.28em -.15em -.36em 0);opacity:1}}

  /* GHOST - a sharp double, not a smudge. what he sees has edges, and that is the problem */
  .fx-ghost .line{animation:fade .6s ease both}
  .ghost{
    position:absolute;left:0;right:0;top:0;margin:0;
    color:var(--steel);opacity:0;pointer-events:none;
    animation:drift 3.4s ease-out both;
  }
  @keyframes drift{0%{transform:none;opacity:0}20%{opacity:.44}100%{transform:translate(.36em,-.12em);opacity:.16}}

  /* FRACTURE - control failing. letters knocked off the line, and they do not come back */
  .fx-fracture .ch,.fx-fever .ch{animation:fracture 2.4s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i)*15ms)}
  @keyframes fracture{
    0%{opacity:0;transform:none}
    22%{opacity:1;transform:translate(calc(var(--dx) * .13em), calc(var(--dy) * .19em)) rotate(calc(var(--rot) * 2.4deg))}
    100%{opacity:1;transform:translate(calc(var(--dx) * .05em), calc(var(--dy) * .07em)) rotate(calc(var(--rot) * .9deg))}
  }

  /* FEVER - fracture in candle gold. only where the text names the heat */
  .plate.fx-fever{--voice:var(--taper)}

  /* CUT - one frame. no zoom, no fade. it is either there or it is not */
  .fx-cut .line{animation:hardcut .01s steps(1,end) both;font-weight:600;letter-spacing:-.014em}
  .fx-cut .line:nth-of-type(2){animation-delay:.4s}
  @keyframes hardcut{from{opacity:0}to{opacity:1}}

  /* MARCH - a man walking somewhere. word by word on a fixed beat */
  .fx-march .wd{animation:march .26s steps(2,end) both;animation-delay:calc(var(--w)*220ms)}
  @keyframes march{from{opacity:0;transform:translateY(.26em)}to{opacity:1;transform:none}}

  /* PRESS - one word carries the line. weight, not size */
  .fx-press .wd{animation:recede .62s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*80ms)}
  @keyframes recede{from{opacity:0}to{opacity:.24}}
  .fx-press .wd.key{
    font-weight:700;
    animation:press .9s cubic-bezier(.16,.84,.32,1) both;
    animation-delay:calc(var(--w)*80ms);
  }
  @keyframes press{from{opacity:0;transform:translateY(.07em)}to{opacity:1;transform:none}}

  /* ERASE - the words that name the thing are wiped back out of the line */
  .fx-erase .wd{animation:wipe .62s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*80ms)}
  /* the dissolve waits until the words have actually been said - starting it at
     1.1s wiped them off the screen mid-breath and read as a fault, not an effect.
     2.2s + 1.3s finishes inside the shortest line that carries key words (3.75s) */
  .fx-erase .wd.key{animation:wipe .62s cubic-bezier(.16,.84,.32,1) both, unwipe 1.3s cubic-bezier(.55,0,.85,.25) 2.2s both}

  /* BLEED - red rises up through the letterforms. held back until the blood is named */
  .fx-bleed .line{
    background:linear-gradient(to top,var(--blood-lit) 0 46%,var(--voice) 60% 100%);
    background-size:100% 250%;
    background-position:0 -125%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:fade .6s ease both, bleed 2.8s ease-in .35s both;
  }
  @keyframes bleed{to{background-position:0 100%}}

  /* STAIN - one word arrives already red and does not come off */
  .fx-stain .wd{animation:wipe .62s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*85ms)}
  .fx-stain .wd.key{color:var(--blood-lit);font-weight:600;animation:wipe .78s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*85ms)}

  /* ECHO - the sentence still sounding. sharp copies lagging behind, no scaling */
  .fx-echo .line{animation:fade .5s ease both}
  .echo{position:absolute;left:0;right:0;top:0;margin:0;pointer-events:none;color:var(--voice)}
  .echo.e1{animation:echo1 2.8s ease-out both}
  .echo.e2{animation:echo2 3.3s ease-out both}
  @keyframes echo1{0%{opacity:0;transform:none}20%{opacity:.26}100%{opacity:0;transform:translateX(-.5em)}}
  @keyframes echo2{0%{opacity:0;transform:none}30%{opacity:.13}100%{opacity:0;transform:translateX(-1.05em)}}

  /* KNELL - the survivor word. the line is wiped away around it while it opens up */
  .fx-knell .wd{animation:wipe .66s cubic-bezier(.16,.84,.32,1) both;animation-delay:calc(var(--w)*90ms)}
  .fx-knell .wd:not(.key){animation:wipe .66s cubic-bezier(.16,.84,.32,1) both, unwipe 1.5s cubic-bezier(.55,0,.85,.25) 2s both}
  .fx-knell .wd.key{
    color:var(--blood-lit);font-weight:600;
    animation:wipe .66s cubic-bezier(.16,.84,.32,1) both, hold 3s cubic-bezier(.25,.8,.3,1) 2s both;
  }
  @keyframes hold{from{letter-spacing:0;transform:none}to{letter-spacing:.07em;transform:scale(1.09)}}

  /* STRIKE - stage directions. the tracking slams shut, then it is left ringing */
  .fx-strike .line{animation:strike 1.7s cubic-bezier(.1,.85,.2,1) both}
  @keyframes strike{
    0%{opacity:0;letter-spacing:1.4em}
    9%{opacity:1;letter-spacing:.42em}
    100%{opacity:.62;letter-spacing:.42em}
  }

  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* frozen while paused, so a pause is a still frame and not a skip */
  .plate.held *{animation-play-state:paused !important}

  /* ---- title and end cards. the same mono slate voice as a stage direction,
         so the frame around the scene is in the scene's own type ---- */
  .card{
    position:absolute;
    inset:0;
    z-index:4;
    display:grid;
    place-content:center;
    text-align:center;
    gap:1.5rem;
    padding:2rem;
    background:rgba(7,8,10,.88);
    animation:fade .8s ease both;
  }
  .card[hidden]{display:none}
  .card .t{
    margin:0;
    font-size:clamp(1.9rem,5.2vw,3.5rem);
    letter-spacing:.01em;
    line-height:1.15;
    color:var(--bone);
  }
  .card .s,.card .n{
    margin:0;
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ash);
  }
  .card .n{color:var(--ash-dim);letter-spacing:.26em}
  .card .rule{height:1px;background:var(--ash-dim);width:min(340px,60vw);margin:0 auto}

  /* ---- prompter / tap sync panel ---- */
  .panel{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:var(--ink)}
  .panel.open{display:grid}
  .panelbox{width:min(760px,88vw);text-align:center}
  .panelhead{display:flex;justify-content:space-between;gap:1rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin-bottom:2rem}
  .tapline{margin:0;font-size:clamp(1.4rem,3.4vw,2.3rem);color:var(--bone);line-height:1.3}
  .tapnext{margin:1.4rem 0 0;font-size:clamp(.95rem,2vw,1.2rem);color:var(--ash);line-height:1.4}
  .tapnote{margin:2.6rem 0 0;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--ash-dim)}
  .rec{display:inline-flex;align-items:center;gap:.5em;color:var(--blood-lit)}
  .rec i{width:.62em;height:.62em;border-radius:50%;background:var(--blood-lit);animation:blink 1.1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.15}}
  button.on{color:var(--taper);border-color:rgba(201,162,74,.45)}
  button.hot{color:var(--blood-lit);border-color:rgba(216,64,42,.5)}
  button:disabled{opacity:.32;cursor:default}

  /* ================= transport ================= */
  .ui{
    position:fixed;
    z-index:6;
    left:0;right:0;bottom:0;
    padding:1.1rem clamp(1rem,4vw,2.4rem) 1.2rem;
    display:flex;
    align-items:center;
    gap:.7rem;
    background:linear-gradient(to top,rgba(7,8,10,.94),rgba(7,8,10,0));
    transition:opacity .45s ease;
  }
  .ui.dim{opacity:0;pointer-events:none}

  .status{
    position:fixed;
    z-index:6;
    left:clamp(1rem,4vw,2.4rem);
    bottom:4.6rem;
    font-family:var(--mono);
    font-size:.62rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ash-dim);
    transition:opacity .45s ease;
    pointer-events:none;
  }
  .status.dim{opacity:0}
  .status b{color:var(--ash);font-weight:400}

  button{
    font-family:var(--mono);
    font-size:.64rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ash);
    background:transparent;
    border:1px solid var(--ash-dim);
    padding:.66em 1.1em;
    cursor:pointer;
    white-space:nowrap;
    transition:color .2s ease,border-color .2s ease;
  }
  button:hover:not(:disabled){color:var(--bone);border-color:var(--ash)}
  button:focus-visible{outline:2px solid var(--taper);outline-offset:2px}
  .sep{width:1px;height:1.5em;background:var(--ash-dim);flex:none}

  .clock{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.12em;
    color:var(--ash);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .scrub{
    flex:1;
    min-width:80px;
    position:relative;
    height:22px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
  }
  .scrub:focus-visible{outline:2px solid var(--taper);outline-offset:4px}
  .track{position:relative;width:100%;height:2px;background:var(--ash-dim)}
  .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--taper)}
  /* one tick per beat, so the bar reads as a shot list */
  .tick{position:absolute;top:-3px;width:1px;height:8px;background:rgba(237,233,225,.16)}
  .tick.her{background:rgba(159,182,194,.3)}
  .head{
    position:absolute;
    top:50%;
    width:9px;height:9px;
    margin:-4.5px 0 0 -4.5px;
    background:var(--bone);
    border-radius:50%;
    pointer-events:none;
    transition:transform .15s ease;
  }
  .scrub:hover .head{transform:scale(1.25)}

  @media (max-width:820px){
    .ui{flex-wrap:wrap;gap:.5rem}
    .scrub{order:-1;flex-basis:100%}
    .sep{display:none}
    .status{bottom:7.4rem}
  }

  @media (prefers-reduced-motion:reduce){
    .frame.hit{animation:none}
    .stage *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
    .fx-bleed .line{background-position:0 100%}
  }
</style>

<div class="frame" id="frame">
  <canvas class="atmos" id="atmos"></canvas>
  <div class="stage"><div class="plate" id="plate"></div></div>

  <div class="card" id="titleCard">
    <p class="s">Macbeth &middot; Act II, scenes i&ndash;ii</p>
    <h1 class="t">The Dagger<br>and the Deed</h1>
    <div class="rule"></div>
    <p class="n">Coby O'Connor</p>
  </div>

  <div class="card" id="endCard" hidden>
    <p class="s">End of Act II, scene ii</p>
    <h1 class="t">The Dagger<br>and the Deed</h1>
    <div class="rule"></div>
    <p class="n">Coby O'Connor</p>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<input type="file" id="audioFile" accept="audio/*,application/json,.json,.webm,.ogg,.m4a,.mp3,.wav" multiple hidden>

<div class="panel" id="panel">
  <div class="panelbox">
    <div class="panelhead"><span id="tapCount">1 / 1</span><span id="tapMode"></span></div>
    <p class="tapline" id="tapLine"></p>
    <p class="tapnext" id="tapNext"></p>
    <p class="tapnote" id="tapNote"></p>
  </div>
</div>

<div class="status" id="status"></div>

<div class="ui" id="ui">
  <button id="play">Play</button>
  <button id="restart">Restart</button>
  <span class="sep"></span>
  <button id="recBtn">Record</button>
  <button id="audioBtn">Audio</button>
  <button id="syncBtn">Sync</button>
  <button id="sfxBtn">Sound on</button>
  <button id="saveBtn">Save</button>
  <span class="sep"></span>
  <span class="clock" id="now">0:00</span>
  <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Scrub through the scene" aria-valuemin="0" aria-valuenow="0" aria-valuemax="100">
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="head" id="head"></div>
    </div>
  </div>
  <span class="clock" id="total">0:00</span>
</div>

<script>
/* ================= the finished take =================
   The performance, cleaned and timed, carried inside the piece itself. When
   this is present there is nothing to load, nothing to sync and nothing to
   press but play - which is the whole point of a finished thing. */
// mp3, because iOS Safari cannot play webm/opus at all and this has to work on
// a phone. the webm is kept beside it for anything that would rather have it.
const BAKED_AUDIO = "dagger.mp3";
const BAKED_AUDIO_ALT = "dagger.webm";
const BAKED_TIMES = [1.09, 5.57, 9.72, 14.34, 18.445, 23.23, 28.16, 32.82, 35.37, 39.66, 43.04, 46.48, 49.79, 53.773, 58.82, 63.59, 66.5, 68.8, 71.88, 74.88, 77.58, 81.76, 84.06, 86.48, 90.64, 94.43, 98.61, 104.43, 107.45, 110.39, 113.98, 119.37, 123.18, 126.23, 127.01, 131.26, 135.37, 139.45, 143.47, 148.53, 151.99, 156.73, 158.01, 160.87, 165.13, 166.064, 169.18, 173.17, 175.62, 178.11, 181.99, 184.98, 188.3, 191.39, 194.42, 196.1, 199.63, 201.78, 203.86, 207.8, 211.04, 212.989, 217.32, 221.12, 222.8, 223.94, 225.28, 226.391, 228.36, 229.38, 231.8, 233.67, 236.15, 239.91, 243.02, 244.67, 248.94, 251.8, 254.08, 256.55, 260.04, 264.36, 268.22, 272.02, 275.11, 279.74, 283.49, 286.16, 289.08, 294.03, 297.93, 302.55, 305.66, 311.11, 315.59, 318.81, 320.55, 325.15, 330.48, 336.99, 340.18, 344.03, 347.83, 350.17, 354.69, 358.59, 362.77, 365.01, 367.68, 369.62, 373.71, 376.61, 381.65, 385.84, 387.65, 390.62, 394.31, 395.9, 399.05, 402.82, 406.63, 411.14, 414.96, 417.76, 421.04, 423.99, 425.45, 428.44, 433.36, 435.18, 436.99, 440.33, 443.37, 444.61, 446.82, 449.43, 450.92, 453.21, 456.43, 458.46, 460.02, 462.61, 467.35, 468.96, 471.13, 474.958];
const IS_FINISHED = !!BAKED_AUDIO && Array.isArray(BAKED_TIMES);

// [ voice, technique, lines, key words ]
const B = [
  ["him","resolve",["Is this a dagger which I see before me,","The handle toward my hand?"]],
  ["him","press",["Come, let me clutch thee."],["clutch"]],
  ["him","ghost",["I have thee not, and yet I see thee still."]],
  ["him","settle",["Art thou not, fatal vision, sensible","To feeling as to sight? or art thou but"]],
  ["him","erase",["A dagger of the mind, a false creation,"],["of","the","mind,"]],
  ["him","fever",["Proceeding from the heat-oppressed brain?"]],
  ["him","cut",["I see thee yet, in form as palpable","As this which now I draw."]],
  ["him","march",["Thou marshall'st me the way that I was going;","And such an instrument I was to use."]],
  ["him","settle",["Mine eyes are made the fools o' the other senses,","Or else worth all the rest; I see thee still,"]],
  ["him","bleed",["And on thy blade and dudgeon gouts of blood,","Which was not so before."]],
  ["him","cut",["There's no such thing:"]],
  ["him","stain",["It is the bloody business which informs","Thus to mine eyes."],["bloody"]],
  ["him","settle",["Now o'er the one halfworld","Nature seems dead, and wicked dreams abuse","The curtain'd sleep;"]],
  ["him","fracture",["witchcraft celebrates","Pale Hecate's offerings, and wither'd murder,"]],
  ["him","march",["Alarum'd by his sentinel, the wolf,","Whose howl's his watch, thus with his stealthy pace."]],
  ["him","ghost",["With Tarquin's ravishing strides, towards his design","Moves like a ghost."]],
  ["him","settle",["Thou sure and firm-set earth,","Hear not my steps, which way they walk, for fear","Thy very stones prate of my whereabout,"]],
  ["him","press",["And take the present horror from the time,","Which now suits with it."],["horror"]],
  ["him","cut",["Whiles I threat, he lives:","Words to the heat of deeds too cold breath gives."]],
  ["sd","strike",["A bell rings"]],
  ["him","march",["I go, and it is done; the bell invites me."]],
  ["him","knell",["Hear it not, Duncan; for it is a knell","That summons thee to heaven or to hell."],["hell."]],

  ["her","lock",["That which hath made them drunk hath made me bold;","What hath quench'd them hath given me fire."]],
  ["her","cut",["Hark! Peace!"]],
  ["her","lock",["It was the owl that shriek'd, the fatal bellman,","Which gives the stern'st good-night."]],
  ["her","lock",["He is about it:","The doors are open; and the surfeited grooms","Do mock their charge with snores:"]],
  ["her","lock",["I have drugg'd their possets,","That death and nature do contend about them,","Whether they live or die."]],
  ["him","ghost",["Who's there? what, ho!"]],
  ["her","lock",["Alack, I am afraid they have awaked,","And 'tis not done."]],
  ["her","press",["The attempt and not the deed","Confounds us."],["Confounds"]],
  ["her","lock",["Hark! I laid their daggers ready;","He could not miss 'em."]],
  ["her","erase",["Had he not resembled","My father as he slept, I had done't."],["My","father"]],
  ["her","cut",["My husband!"]],
  ["him","stain",["I have done the deed.","Didst thou not hear a noise?"],["deed."]],
  ["her","lock",["I heard the owl scream and the crickets cry.","Did not you speak?"]],
  ["him","cut",["When?"]],

/* ================= timing model =================
   Every line in the scene is a cue. LINE_T[k] is the second at which cue k is
   spoken, and LINE_T has one extra entry on the end for the finish.
   With no recording loaded these are estimated from line length. Once a take is
   recorded or tapped they are measured, and nothing can drift after that. */

const CUES = [];
B.forEach((beat, bi) => beat[2].forEach((text, li) => CUES.push({ bi, li, text })));

function estimate(b){
  const text = b[2].join(" ");
  const chars = text.length;
  const words = text.split(" ").length;
  switch(b[1]){
    case "cut":      return Math.max(1000, chars * 58);
    case "strike":   return 2100;
    case "march":    return 800 + words * 230;
    case "knell":    return chars * 60 + 4000;
    case "echo":     return chars * 62 + 1300;
    case "fracture":
    case "fever":    return chars * 66 + 1200;
    default:         return Math.min(11000, Math.max(2200, chars * 66 + 800));
  }
}

function estimatedTimes(){
  const times = [];
  let t = 0;
  B.forEach(beat => {
    const d = estimate(beat) / 1000;
    const n = beat[2].length;
    beat[2].forEach((_, li) => times.push(t + (li * d) / n));
    t += d;
  });
  times.push(t);
  return times;
}

const STORE = "macbeth-dagger-timings-v1";
function loadSaved(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length === CUES.length + 1) return arr;
  } catch(e){}
  return null;
}
function saveTimes(arr){
  try { localStorage.setItem(STORE, JSON.stringify(arr)); } catch(e){}
}

let LINE_T = (typeof IS_FINISHED !== "undefined" && IS_FINISHED && BAKED_TIMES.length)
  ? BAKED_TIMES.slice()
  : (loadSaved() || estimatedTimes());
let SYNCED = (typeof IS_FINISHED !== "undefined" && IS_FINISHED) || !!loadSaved();
const TOTAL = () => LINE_T[LINE_T.length - 1];

// first cue index of each beat, so a beat can find its own start and end
const BEAT_FIRST = [];
CUES.forEach((c, k) => { if (BEAT_FIRST[c.bi] === undefined) BEAT_FIRST[c.bi] = k; });

/* ---------- rendering ---------- */
function seeded(n){ const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function buildLine(text, beat, wordOffset, seed, lineStart, lineEnd, atTime){
  const p = document.createElement("p");
  p.className = "line";
  const words = text.split(" ");
  const keys = beat[3] || [];

  // words are spread across the time the line takes to SAY, not across the gap
  // to the next cue - a long pause after a line must not stretch its reveal into
  // a crawl, and a cue that follows quickly must still animate rather than snap
  const gap = Math.max(.001, lineEnd - lineStart);
  const spoken = words.length * .20;                 // brisk, so the type keeps up
  const span = Math.max(.32, Math.min(spoken, gap * .80));
  let ci = 0;
  words.forEach((word, wi) => {
    const w = document.createElement("span");
    w.className = "wd" + (keys.includes(word) ? " key" : "");
    w.style.setProperty("--w", wordOffset + wi);
    // start the reveal a beat early so the word has finished arriving by the time
    // it is spoken, instead of only starting to appear on it
    const LEAD = .34;
    const wordAt = lineStart + (wi / words.length) * span - LEAD;
    w.style.animationDelay = (wordAt - atTime).toFixed(3) + "s";
    [...word].forEach(c => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.style.setProperty("--i", ci);
      s.style.setProperty("--dx", (seeded(seed + ci) * 2 - 1).toFixed(3));
      s.style.setProperty("--dy", (seeded(seed + ci + 91) * 2 - 1).toFixed(3));
      s.style.setProperty("--rot", (seeded(seed + ci + 313) * 2 - 1).toFixed(3));
      ci++;
      w.appendChild(s);
    });
    p.appendChild(w);
    if (wi < words.length - 1) p.appendChild(document.createTextNode(" "));
  });
  return { el: p, count: words.length };
}

function render(bi, atTime){
  const beat = B[bi];
  const [who, fx] = beat;
  plate.className = "plate " + who + " fx-" + fx;
  plate.innerHTML = "";
  const first = BEAT_FIRST[bi];
  let off = 0;
  beat[2].forEach((text, li) => {
    const k = first + li;
    const lineStart = LINE_T[k];
    const lineEnd = LINE_T[k + 1] !== undefined ? LINE_T[k + 1] : lineStart + 2;
    const { el, count } = buildLine(text, beat, off, bi * 97 + li * 13, lineStart, lineEnd, atTime);
    off += count;
    if (fx === "ghost" || fx === "echo"){
      const wrap = document.createElement("div");
      wrap.className = "linewrap";
      wrap.appendChild(el);
      (fx === "ghost" ? ["ghost"] : ["echo e1", "echo e2"]).forEach(cls => {
        const c = el.cloneNode(true);
        c.className = "line " + cls;
        wrap.appendChild(c);
      });
      plate.appendChild(wrap);
    } else {
      plate.appendChild(el);
    }
  });
  if (fx !== "strike") fit(who, beat[2]);
  if (fx === "strike"){
    frame.classList.remove("hit");
    void frame.offsetWidth;
    frame.classList.add("hit");
    jolt(0.55);                     // the flame flinches at the bell and the knocking
  }
  // the room takes the blood the moment the text names it
  if (fx === "bleed") stain(0.30);
  else if (fx === "stain") stain(0.16);
  else if (fx === "knell") stain(0.10);
}

const BASE = 44;
function fit(who, lines){
  const col = document.querySelector(".stage").clientWidth;
  plate.style.setProperty("--size", BASE + "px");
  let widest = 0;
  plate.querySelectorAll(".line").forEach(l => { widest = Math.max(widest, l.scrollWidth); });
  if (!widest) return;
  const words = lines.join(" ").split(" ").length;
  const ceiling = words <= 4 ? 96 : (who === "her" ? 46 : 54);
  const size = Math.max(18, Math.min(ceiling, BASE * (col / widest)));
  plate.style.setProperty("--size", size.toFixed(1) + "px");
}

/* ---------- playback: audio drives it when audio is loaded ---------- */
let hasAudio = false, playing = false, raf = null, lastTs = 0, clockPos = 0;
let current = -1, hideTimer = null, tapping = false, recording = false;

function position(){ return hasAudio ? audio.currentTime : clockPos; }

function cueAt(t){
  let lo = 0, hi = CUES.length - 1, ans = 0;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (LINE_T[mid] <= t){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function paintBar(){
  const t = position();
  const pct = Math.min(1, t / TOTAL());
  fill.style.width = (pct * 100) + "%";
  head.style.left = (pct * 100) + "%";
  nowEl.textContent = clock(t);
  scrub.setAttribute("aria-valuenow", Math.round(pct * 100));
}

// when the line currently on screen has been spoken, plus a breath. per LINE,
// not per beat: he pauses inside a speech as well as between them, and a beat
// whose second line arrives twenty seconds late would otherwise hang on its
// first line for the whole wait
function restsAt(k){
  const words = CUES[k].text.split(" ").length;
  return LINE_T[k] + words * 0.32 + 2.4;
}

function sync(force){
  const t = position();
  const k = cueAt(Math.min(t, TOTAL() - .01));
  const bi = CUES[k].bi;
  const entered = bi !== current;
  if (entered || force){ current = bi; render(bi, t); }
  // a cue sounds when the scene reaches it, never when you drag the bar to it
  if (entered && playing) fireCue(bi);
  plate.classList.toggle("rest", t > restsAt(k));
  paintBar();
}

function tick(ts){
  if (!playing) return;
  if (!hasAudio){
    if (!lastTs) lastTs = ts;
    clockPos += (ts - lastTs) / 1000;
    lastTs = ts;
  }
  if (position() >= TOTAL()){ finish(); return; }
  sync(false);
  raf = requestAnimationFrame(tick);
}

function play(){
  if (position() >= TOTAL()){ if (hasAudio) audio.currentTime = 0; else clockPos = 0; }
  titleCard.hidden = true;
  endCard.hidden = true;
  playing = true;
  lastTs = 0;
  plate.classList.remove("held");
  playBtn.textContent = "Pause";
  if (hasAudio) audio.play().catch(() => {});
  startTone();
  sync(true);
  raf = requestAnimationFrame(tick);
  autoHide();
}

function pause(){
  playing = false;
  cancelAnimationFrame(raf);
  if (hasAudio) audio.pause();
  stopTone();
  plate.classList.add("held");           // freeze the animations where they are
  playBtn.textContent = "Play";
  showUI(true);
}

function finish(){
  playing = false;
  cancelAnimationFrame(raf);
  if (hasAudio) audio.pause();
  stopTone();
  plate.className = "plate";
  plate.innerHTML = "";
  current = -1;
  endCard.hidden = false;
  playBtn.textContent = "Replay";
  paintBar();
  showUI(true);
}

function seekTo(sec){
  const t = Math.max(0, Math.min(TOTAL() - .01, sec));
  titleCard.hidden = true;
  endCard.hidden = true;
  if (hasAudio) audio.currentTime = t; else clockPos = t;
  lastTs = 0;
  current = -1;
  sync(true);
}

/* ---------- controls ---------- */
playBtn.addEventListener("click", () => { playing ? pause() : play(); });
restartBtn.addEventListener("click", () => { resetRoom(); seekTo(0); if (!playing) play(); });

function pctFromEvent(e){
  const r = track.getBoundingClientRect();
  return (e.clientX - r.left) / r.width;
}
let dragging = false;
scrub.addEventListener("pointerdown", e => {
  dragging = true;
  scrub.setPointerCapture(e.pointerId);
  seekTo(pctFromEvent(e) * TOTAL());
});
scrub.addEventListener("pointermove", e => { if (dragging) seekTo(pctFromEvent(e) * TOTAL()); });
scrub.addEventListener("pointerup", e => { dragging = false; scrub.releasePointerCapture(e.pointerId); });
scrub.addEventListener("keydown", e => {
  const k = cueAt(Math.min(position(), TOTAL() - .01));
  if (e.key === "ArrowRight"){ e.preventDefault(); seekTo(LINE_T[Math.min(CUES.length - 1, k + 1)]); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); seekTo(LINE_T[Math.max(0, k - 1)]); }
});

/* ================= cleaning the take =================
   A recording made at a desk carries three things the piece does not want: the
   room, the breaths between lines, and the key presses used to mark each line.
   All three are removed here, on load, so the take stored with the piece stays
   the raw original and every viewer hears the cleaned one.

   Order matters. De-click first, because a key press must not be allowed to
   hold the expander open. Expander next, so the room falls away in the gaps.
   Compression after that, so the room is never compressed up. Normalise last,
   so the peak we set is the final one. */

function dbTo(x){ return Math.pow(10, x / 20); }
function toDb(x){ return x <= 0 ? -120 : 20 * Math.log10(x); }

function frameRms(d, sr, hopMs){
  const H = Math.max(1, Math.floor(sr * hopMs / 1000));
  const out = new Float32Array(Math.floor(d.length / H));
  for (let f = 0; f < out.length; f++){
    let s = 0;
    const a = f * H, b = Math.min(d.length, a + H);
    for (let i = a; i < b; i++) s += d[i] * d[i];
    out[f] = Math.sqrt(s / Math.max(1, b - a));
  }
  return { rms: out, hop: H };
}

function pctile(arr, p){
  const a = Float32Array.from(arr).sort();
  return a[Math.min(a.length - 1, Math.floor(a.length * p))];
}

// two one-pole stages, to lose desk rumble and mic handling
function cleanHighpass(d, sr, fc){
  const rc = 1 / (2 * Math.PI * fc), a = rc / (rc + 1 / sr);
  for (let pass = 0; pass < 2; pass++){
    let pi = d[0], po = 0;
    for (let i = 0; i < d.length; i++){
      const x = d[i];
      po = a * (po + x - pi);
      pi = x;
      d[i] = po;
    }
  }
}

/* The timing sheet is a list of key presses, so this does not have to hunt for
   clicks - it looks only just before each cue, and only removes an excursion
   that is both much louder than the speech after it and too short to be speech. */
function cleanDeclick(d, sr, stamps){
  let removed = 0;
  const pad = Math.floor(sr * 0.012);
  for (let n = 0; n < stamps.length - 1; n++){
    const t = stamps[n];
    const from = Math.max(0, Math.floor((t - 0.26) * sr));
    const to = Math.min(d.length, Math.floor((t + 0.06) * sr));
    if (to - from < 32) continue;
    let speech = 0;
    const sA = Math.min(d.length, Math.floor((t + 0.12) * sr));
    const sB = Math.min(d.length, Math.floor((t + 0.60) * sr));
    for (let i = sA; i < sB; i++) speech = Math.max(speech, Math.abs(d[i]));
    let peak = 0, at = -1;
    for (let i = from; i < to; i++){
      const v = Math.abs(d[i]);
      if (v > peak){ peak = v; at = i; }
    }
    if (at < 0 || peak < Math.max(0.02, speech * 0.55)) continue;
    let a = at, b = at;
    const edge = peak * 0.18;
    while (a > from && Math.abs(d[a]) > edge) a--;
    while (b < to - 1 && Math.abs(d[b]) > edge) b++;
    if ((b - a) > sr * 0.035) continue;
    const s = Math.max(0, a - pad), e = Math.min(d.length, b + pad);
    for (let i = s; i < e; i++){
      const u = (i - s) / Math.max(1, e - s - 1);
      d[i] *= 1 - (0.5 - 0.5 * Math.cos(2 * Math.PI * u)) * 0.97;
    }
    removed++;
  }
  return removed;
}

// a downward expander, not a hard gate: the room is pushed away rather than
// switched off, so the track never sounds chopped
function cleanExpander(d, sr, openDb, floorDb){
  const open = dbTo(openDb), depth = dbTo(floorDb);
  const atk = Math.exp(-1 / (sr * 0.010)), rel = Math.exp(-1 / (sr * 0.220));
  const hold = Math.floor(sr * 0.080);
  let env = 0, gain = depth, held = 0;
  for (let i = 0; i < d.length; i++){
    const x = Math.abs(d[i]);
    env = x > env ? atk * env + (1 - atk) * x : rel * env + (1 - rel) * x;
    let target;
    if (env > open){ target = 1; held = hold; }
    else if (held > 0){ target = 1; held--; }
    else target = depth;
    gain += (target - gain) * (target > gain ? 0.02 : 0.0009);
    d[i] *= gain;
  }
}

// the take runs about thirty decibels between its quietest and loudest lines.
// under a piece where the voice is the only foreground, that means half the
// scene is inaudible. this narrows it so every line lands.
function cleanCompress(d, sr, threshDb, ratio){
  const thresh = dbTo(threshDb);
  const atk = Math.exp(-1 / (sr * 0.008)), rel = Math.exp(-1 / (sr * 0.180));
  let env = 0;
  for (let i = 0; i < d.length; i++){
    const x = Math.abs(d[i]);
    env = x > env ? atk * env + (1 - atk) * x : rel * env + (1 - rel) * x;
    if (env > thresh){
      const over = toDb(env) - threshDb;
      d[i] *= dbTo(threshDb + over / ratio - toDb(env));
    }
  }
}

function cleanNormalise(d, targetDb){
  let peak = 0;
  for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  if (peak <= 0) return;
  const g = dbTo(targetDb) / peak;
  for (let i = 0; i < d.length; i++) d[i] = Math.max(-1, Math.min(1, d[i] * g));
}

/* The taps mark roughly where each line starts, but they carry his reaction
   time. The audio knows better: this finds where the voice actually begins near
   each cue and moves the cue there, which is what makes the type land on the
   word instead of near it. */
function cleanSnapCues(d, sr, stamps){
  const { rms, hop } = frameRms(d, sr, 10);
  const gate = Math.max(pctile(rms, 0.12) * 6, dbTo(-46));
  const out = stamps.slice();
  for (let n = 0; n < stamps.length - 1; n++){
    const back = n === 0 ? 0.9 : 0.40;
    const a = Math.max(0, Math.floor((stamps[n] - back) * sr / hop));
    const b = Math.min(rms.length - 1, Math.floor((stamps[n] + 1.10) * sr / hop));
    let hit = -1;
    for (let f = a; f <= b; f++){
      if (rms[f] > gate){
        let ok = true;
        for (let k = 1; k <= 4 && f + k <= b; k++) if (rms[f + k] < gate * 0.55){ ok = false; break; }
        if (ok){ hit = f; break; }
      }
    }
    if (hit >= 0) out[n] = Math.max(0, hit * hop / sr - 0.06);
  }
  for (let n = 1; n < out.length; n++) if (out[n] <= out[n - 1]) out[n] = out[n - 1] + 0.05;
  return out;
}

function toWavBlob(d, sr){
  const n = d.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = function(o, s){ for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++){
    const s = Math.max(-1, Math.min(1, d[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* Run the whole chain on a take. Returns a cleaned blob to play and, when the
   cues have not already been snapped, a corrected timing sheet. */
async function cleanTake(blob, stamps, alreadySnapped){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const src = await ctx.decodeAudioData(await blob.arrayBuffer());
    const sr = src.sampleRate;
    const d = Float32Array.from(src.getChannelData(0));
    cleanHighpass(d, sr, 85);
    const clicks = cleanDeclick(d, sr, stamps);
    cleanExpander(d, sr, -42, -22);
    cleanCompress(d, sr, -26, 3);
    cleanNormalise(d, -1.5);
    const times = alreadySnapped ? stamps : cleanSnapCues(d, sr, stamps);
    return { blob: toWavBlob(d, sr), times: times, clicks: clicks, duration: src.duration };
  } finally {
    try { ctx.close(); } catch(e){}
  }
}

/* ================= the take =================
   One recording of the whole scene plus the measured cue times. It is held in
   the piece itself, not in this browser, so the take made on one machine is
   the take every machine opens. */

let takeBlob = null, takeMime = "", takeSaved = false, dirty = false;

async function applyTake(src, times, label, blob, mime, opts){
  const o = opts || {};
  takeBlob = blob || takeBlob;
  takeMime = mime || takeMime;
  // clean what we play, keep what we store: the piece holds the raw take so
  // it can always be re-cleaned, and every viewer hears the cleaned one
  if (takeBlob && !o.raw){
    try {
      setStatus("Preparing the take &mdash; removing the room, the breaths and the key presses");
      const res = await cleanTake(takeBlob, times || LINE_T, !!o.snapped);
      src = URL.createObjectURL(res.blob);
      times = res.times;
      cleanedInfo = res.clicks + " key presses removed";
    } catch(e){ cleanedInfo = ""; }
  }
  audio.src = src;
  hasAudio = true;
  audioBtn.textContent = "Audio on";
  audioBtn.classList.add("on");
  syncBtn.disabled = false;
  if (times && times.length === CUES.length + 1){
    LINE_T = times;
    SYNCED = true;
    saveTimes(times);
  }
  drawTicks();
  seekTo(0);
  titleCard.hidden = false;
  endCard.hidden = true;
  refreshStatus(label);
  refreshSave();
}

let cleanedInfo = "";
function refreshStatus(label){
  if (typeof IS_FINISHED !== "undefined" && IS_FINISHED) return;
  const timing = SYNCED ? "timed to the voice" : "timing estimated";
  const clean = cleanedInfo ? " &middot; cleaned, " + cleanedInfo : "";
  setStatus("Voice: <b>" + (label || (hasAudio ? "loaded" : "none")) + "</b> &middot; " + timing + clean);
}

function refreshSave(){
  const can = false;
  saveBtn.disabled = !can;
  saveBtn.textContent = takeSaved && !dirty ? "Saved" : "Save";
  saveBtn.classList.toggle("on", takeSaved && !dirty);
}

/* ---------- a recording chosen from disk ----------
   Pick the audio on its own, or pick the audio and the .json the local recorder
   writes beside it together, in which case the take arrives already timed. */
audioBtn.addEventListener("click", () => audioFile.click());

function readJSON(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onerror = () => res(null);
    r.onload = () => { try { res(JSON.parse(String(r.result))); } catch(e){ res(null); } };
    r.readAsText(file);
  });
}

audioFile.addEventListener("change", async () => {
  const picked = [...(audioFile.files || [])];
  if (!picked.length) return;
  const isJSON = f => /\.json$/i.test(f.name) || f.type === "application/json";
  const sound = picked.find(f => !isJSON(f));
  const sheet = picked.find(isJSON);
  if (!sound){
    setStatus("That was a timing file on its own &mdash; pick the recording with it");
    return;
  }

  let times = null, sheetRejected = false;
  if (sheet){
    const j = await readJSON(sheet);
    const arr = Array.isArray(j) ? j : (j && j.times);
    if (Array.isArray(arr) && arr.length === CUES.length + 1) times = arr;
    else sheetRejected = true;
  }

  const wasSynced = SYNCED || !!times;
  takeSaved = false; dirty = true;
  const label = times ? sound.name + " + timings"
              : sheetRejected ? sound.name + " (that timing file is for another scene)"
              : sound.name;
  await applyTake(URL.createObjectURL(sound), times, label, sound, sound.type || "audio/webm",
                  { snapped: !!(sheet && times) });
  audio.addEventListener("loadedmetadata", () => {
    if (!wasSynced && audio.duration){
      // stretch the estimate to the real length so it is close before you tap
      const scale = audio.duration / TOTAL();
      LINE_T = LINE_T.map(t => t * scale);
      drawTicks();
      seekTo(0);
    }
    refreshStatus(label);
    refreshSave();
  }, { once: true });
});

/* ---------- recording in the page, with a prompter ---------- */
let mediaRec = null, recChunks = [], recStart = 0, recTimes = [], recIdx = 0, recTimer = null;

// recIdx is the line the NEXT tap will stamp, so the line being spoken right
// now is the one before it
function promptView(){
  const i = Math.max(0, recIdx - 1);
  const el = recStart ? "  ·  " + clock((performance.now() - recStart) / 1000) : "";
  tapCount.textContent = (i + 1) + " / " + CUES.length + el;
  tapLine.textContent = CUES[i] ? CUES[i].text : "";
  tapNext.textContent = CUES[i + 1] ? CUES[i + 1].text : "end of scene";
}

async function startRecording(){
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){
    setStatus("Microphone blocked here &mdash; record the take in any recorder, then use <b>Audio</b> to load the file");
    return;
  }
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  try {
    mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 40000 } : {});
  } catch(e){
    setStatus("This browser cannot record here &mdash; record elsewhere and load it with <b>Audio</b>");
    stream.getTracks().forEach(t => t.stop());
    return;
  }
  recChunks = [];
  recTimes = [];
  recIdx = 0;
  mediaRec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    finishRecording(mediaRec.mimeType || mime || "audio/webm");
  };
  recStart = 0;
  recording = true;
  if (playing) pause();
  recBtn.textContent = "Stop";
  recBtn.classList.add("hot");
  panel.classList.add("open");
  tapMode.innerHTML = '<span class="rec"><i></i>Recording</span>';
  tapNote.textContent = "Read the line, and tap space the instant you start each new one. Backspace undoes a tap. Enter or Stop ends the take.";
  promptView();
  mediaRec.start();
  recStart = performance.now();
  recTimes[0] = 0;                   // the first line starts with the recording
  recIdx = 1;
  promptView();
  recTimer = setInterval(promptView, 250);
}

function stopRecording(){
  if (!mediaRec || mediaRec.state === "inactive") return;
  clearInterval(recTimer);
  mediaRec.stop();
}

function finishRecording(mime){
  recording = false;
  panel.classList.remove("open");
  recBtn.textContent = "Record";
  recBtn.classList.remove("hot");
  const blob = new Blob(recChunks, { type: mime });
  const seconds = (performance.now() - recStart) / 1000;
  if (!blob.size){ setStatus("Nothing was recorded"); refreshSave(); return; }
  // lines never reached keep the average spacing of the ones that were
  const out = recTimes.slice(0, recIdx);
  const gap = out.length > 1 ? (out[out.length - 1] - out[0]) / (out.length - 1) : 2;
  while (out.length < CUES.length) out.push(out[out.length - 1] + gap);
  out.push(Math.max(seconds, out[out.length - 1] + gap));
  takeSaved = false; dirty = true;
  applyTake(URL.createObjectURL(blob), out, "this machine's take", blob, mime);
}


recBtn.addEventListener("click", () => { recording ? stopRecording() : startRecording(); });

/* ---------- tap sync, for a take recorded somewhere else ---------- */
let tapIdx = 0, tapTimes = [];

function tapView(){
  tapCount.textContent = (tapIdx + 1) + " / " + CUES.length;
  tapLine.textContent = CUES[tapIdx] ? CUES[tapIdx].text : "";
  tapNext.textContent = CUES[tapIdx + 1] ? CUES[tapIdx + 1].text : "end of scene";
}

function startTap(){
  if (!hasAudio) return;
  tapping = true;
  tapIdx = 0;
  tapTimes = [];
  panel.classList.add("open");
  tapMode.textContent = "Space to tap, Backspace to undo, Esc to cancel";
  tapNote.textContent = "Tap space the instant you start saying each line. Backspace undoes the last one.";
  tapView();
  audio.currentTime = 0;
  audio.play().catch(() => {});
  refreshSave();
}

function endTap(save){
  tapping = false;
  panel.classList.remove("open");
  audio.pause();
  if (save && tapTimes.length > 1){
    // any lines you did not reach keep their estimated spacing after the last tap
    const out = tapTimes.slice();
    const lastGap = (out[out.length - 1] - out[0]) / Math.max(1, out.length - 1);
    while (out.length < CUES.length) out.push(out[out.length - 1] + lastGap);
    out.push(Math.max(audio.duration || 0, out[out.length - 1] + lastGap));
    LINE_T = out;
    SYNCED = true;
    saveTimes(out);
    drawTicks();
    seekTo(0);
    takeSaved = false; dirty = true;
  }
  refreshStatus();
  refreshSave();
}

syncBtn.addEventListener("click", () => { tapping ? endTap(true) : startTap(); });

document.addEventListener("keydown", e => {
  if (recording){
    if (e.code === "Space"){
      e.preventDefault();
      if (recIdx < CUES.length){
        recTimes[recIdx] = (performance.now() - recStart) / 1000;
        recIdx++;
        promptView();
      }
      return;
    }
    if (e.code === "Backspace"){
      e.preventDefault();
      if (recIdx > 1){ recIdx--; recTimes.length = recIdx; promptView(); }
      return;
    }
    if (e.code === "Enter" || e.code === "Escape"){ e.preventDefault(); stopRecording(); }
    return;
  }
  if (tapping){
    if (e.code === "Space"){
      e.preventDefault();
      tapTimes[tapIdx] = audio.currentTime;
      tapIdx++;
      if (tapIdx >= CUES.length){ endTap(true); return; }
      tapView();
      return;
    }
    if (e.code === "Backspace"){
      e.preventDefault();
      if (tapIdx > 0){ tapIdx--; tapTimes.length = tapIdx; tapView(); }
      return;
    }
    if (e.code === "Escape"){ e.preventDefault(); endTap(false); return; }
    return;
  }
  if (e.code === "Space" && e.target === document.body){ e.preventDefault(); playing ? pause() : play(); }
  showUI(false);
});

/* ================= the room =================
   The scene is lit by one carried taper and nothing else, so the frame should
   behave like a room with a candle in it rather than a black panel with words
   on it. Three things happen on this layer, and each is tied to the text:

     the flame   - the light breathes, and it gutters when something strikes
     the grain   - a film stock, so the dark is never a dead flat black
     the stain   - red gathers at the foot of the frame from the moment blood is
                   first named, and it never fully leaves

   All of it sits behind the type and none of it is ever brighter than a word. */

const atmos = document.getElementById("atmos");
const ax = atmos.getContext("2d", { alpha: false });
let aw = 0, ah = 0, grainTile = null, atmosRaf = null;
let flameJolt = 0;       // kicked by a stage direction
let stainLevel = 0;      // rises when blood is named, and stays risen
let stainPulse = 0;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function makeGrain(){
  const n = 128;
  const c = document.createElement("canvas");
  c.width = c.height = n;
  const g = c.getContext("2d");
  const img = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++){
    const v = 128 + (Math.random() * 2 - 1) * 90;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
    img.data[i*4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

function sizeAtmos(){
  const dpr = Math.min(1.25, window.devicePixelRatio || 1);
  aw = Math.floor(innerWidth * dpr);
  ah = Math.floor(innerHeight * dpr);
  atmos.width = aw;
  atmos.height = ah;
  atmos.style.width = innerWidth + "px";
  atmos.style.height = innerHeight + "px";
}

/* A real flame is not a sine. It idles with a slow wander, twitches at a faster
   rate, and now and then drops away for a moment before recovering. */
function flame(t){
  const idle = 0.82
    + 0.10 * Math.sin(t * 0.9)
    + 0.05 * Math.sin(t * 2.3 + 1.1)
    + 0.03 * Math.sin(t * 5.7 + 0.4);
  const gutter = Math.max(0, Math.sin(t * 0.37 + 2.0) - 0.985) * 26;  // rare dip
  return Math.max(0.35, idle - gutter + flameJolt);
}

function paintAtmos(ms){
  const t = ms / 1000;
  const lit = REDUCED ? 0.85 : flame(t);

  ax.fillStyle = "#07080A";
  ax.fillRect(0, 0, aw, ah);

  // the taper: low and to the left, the way a carried candle sits
  const cx = aw * 0.15, cy = ah * 0.86;
  const r = Math.max(aw, ah) * (0.62 + lit * 0.13);
  const pool = ax.createRadialGradient(cx, cy, 0, cx, cy, r);
  pool.addColorStop(0.00, "rgba(201,162,74," + (0.115 * lit).toFixed(4) + ")");
  pool.addColorStop(0.34, "rgba(160,120,52," + (0.052 * lit).toFixed(4) + ")");
  pool.addColorStop(1.00, "rgba(0,0,0,0)");
  ax.fillStyle = pool;
  ax.fillRect(0, 0, aw, ah);

  // a second, tighter core so the source reads as a flame not a wash
  const core = ax.createRadialGradient(cx, cy, 0, cx, cy, r * 0.22);
  core.addColorStop(0, "rgba(227,184,92," + (0.085 * lit).toFixed(4) + ")");
  core.addColorStop(1, "rgba(0,0,0,0)");
  ax.fillStyle = core;
  ax.fillRect(0, 0, aw, ah);

  // the stain: it only exists after the text has named blood, it gathers along
  // the floor of the frame, and it never washes out
  const red = Math.min(1, stainLevel + stainPulse);
  if (red > 0.001){
    const g = ax.createLinearGradient(0, ah, 0, ah * 0.42);
    g.addColorStop(0, "rgba(179,32,19," + (0.20 * red).toFixed(4) + ")");
    g.addColorStop(1, "rgba(179,32,19,0)");
    ax.fillStyle = g;
    ax.fillRect(0, 0, aw, ah);
  }

  // film grain
  if (!REDUCED){
    ax.globalAlpha = 0.030;
    ax.globalCompositeOperation = "overlay";
    const ox = -Math.random() * 128, oy = -Math.random() * 128;
    for (let x = ox; x < aw; x += 128)
      for (let y = oy; y < ah; y += 128)
        ax.drawImage(grainTile, x, y);
    ax.globalCompositeOperation = "source-over";
    ax.globalAlpha = 1;
  }

  // decay the transients
  flameJolt *= 0.92;
  stainPulse *= 0.985;
  atmosRaf = requestAnimationFrame(paintAtmos);
}

function startAtmos(){
  grainTile = makeGrain();
  sizeAtmos();
  if (!atmosRaf) atmosRaf = requestAnimationFrame(paintAtmos);
}

// the light flinches when the bell or the knocking lands
function jolt(strength){ flameJolt = Math.max(flameJolt, strength); }

// blood named: the room takes it and keeps it
function stain(amount){
  stainPulse = Math.min(0.6, stainPulse + amount);
  stainLevel = Math.min(0.55, stainLevel + amount * 0.34);
}

function resetRoom(){ stainLevel = 0; stainPulse = 0; flameJolt = 0; }

let atmosResize = null;
window.addEventListener("resize", function(){
  clearTimeout(atmosResize);
  atmosResize = setTimeout(sizeAtmos, 120);
});
startAtmos();

/* ================= the sounds the script asks for =================
   Three cues, and every one of them is built here rather than loaded: the bell
   that calls Macbeth to the murder, the knocking that answers it four times,
   and a room tone under the whole scene. Nothing is fetched, so nothing can
   fail to load, there is no licence attached to any of it, and the sound is
   composed to this piece rather than picked off a shelf. */

const SFX_STORE = "macbeth-dagger-sfx-v1";
let AC = null, master = null, sfxOn = true, tone = null;

function audioCtx(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 1;
    master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}

// brown noise is white noise integrated: it falls away with frequency the way
// distance and a closed door take the top off a sound
function noiseBuf(c, seconds, brown){
  const n = Math.max(1, Math.floor(c.sampleRate * seconds));
  const b = c.createBuffer(1, n, c.sampleRate);
  const d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++){
    const w = Math.random() * 2 - 1;
    if (brown){ last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    else d[i] = w;
  }
  return b;
}

/* A bell is inharmonic - hum, prime, tierce, quint, nominal - each partial
   decaying at its own rate with the low ones ringing longest. That spread is
   what makes it a bell and not an organ note. Lowpassed, because Macbeth is
   hearing it through a castle. */
const BELL_PARTIALS = [
  [0.50, 1.00, 7.0], [1.00, 0.85, 6.0], [1.19, 0.55, 4.2], [1.50, 0.42, 3.4],
  [2.00, 0.50, 3.0], [2.51, 0.22, 2.0], [3.01, 0.16, 1.5], [4.17, 0.10, 1.0]
];

function makeBell(c, out, t0, g){
  const f0 = 164;
  const lp = c.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 2100; lp.Q.value = 0.5;
  const bus = c.createGain(); bus.gain.value = g;
  bus.connect(lp); lp.connect(out);
  BELL_PARTIALS.forEach(function(p){
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.value = f0 * p[0];
    const env = c.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.linearRampToValueAtTime(p[1], t0 + 0.004);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + p[2]);
    o.connect(env); env.connect(bus);
    o.start(t0); o.stop(t0 + p[2] + 0.1);
  });
  // the strike itself, before the tone settles
  const src = c.createBufferSource();
  src.buffer = noiseBuf(c, 0.14, false);
  const nf = c.createBiquadFilter();
  nf.type = "bandpass"; nf.frequency.value = 2400; nf.Q.value = 1.2;
  const ne = c.createGain();
  ne.gain.setValueAtTime(0.5, t0);
  ne.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
  src.connect(nf); nf.connect(ne); ne.connect(bus);
  src.start(t0); src.stop(t0 + 0.14);
}

/* Three raps on a heavy door, heard through it: a noise burst for the wood and
   a falling sine for the weight behind it. Each of the four knockings in the
   scene is louder and a shade brighter than the last, because the text
   escalates and the mix should carry that rather than a music cue. */
function makeKnock(c, out, t0, g, step){
  const lp = c.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 620 + step * 130;
  lp.Q.value = 0.7;
  const bus = c.createGain(); bus.gain.value = g;
  bus.connect(lp); lp.connect(out);
  [0, 0.24, 0.47].forEach(function(gap, i){
    const t = t0 + gap + i * 0.006;
    const src = c.createBufferSource();
    src.buffer = noiseBuf(c, 0.1, false);
    const bp = c.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 260; bp.Q.value = 1.6;
    const e = c.createGain();
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(0.9, t + 0.004);
    e.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
    src.connect(bp); bp.connect(e); e.connect(bus);
    src.start(t); src.stop(t + 0.1);
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(58, t + 0.1);
    const oe = c.createGain();
    oe.gain.setValueAtTime(0.0001, t);
    oe.gain.exponentialRampToValueAtTime(0.7, t + 0.006);
    oe.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(oe); oe.connect(bus);
    o.start(t); o.stop(t + 0.16);
  });
}

/* Room tone. Not an effect - it is what stops six minutes of a single voice
   sounding like it was recorded in a vacuum. Pitched below the level anyone
   would notice unless it stopped. */
function makeTone(c, out, g){
  const src = c.createBufferSource();
  src.buffer = noiseBuf(c, 4, true);
  src.loop = true;
  const lp = c.createBiquadFilter(); lp.type = "lowpass";  lp.frequency.value = 320; lp.Q.value = 0.4;
  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 40;
  const gn = c.createGain(); gn.gain.value = 0.0001;
  src.connect(lp); lp.connect(hp); hp.connect(gn); gn.connect(out);
  src.start();
  gn.gain.linearRampToValueAtTime(g, c.currentTime + 2.5);
  return { node: src, gain: gn };
}

// which sound belongs to which stage direction, and where each knocking sits
// in the run of four
const SD_SOUND = {};
(function(){
  let k = 0;
  B.forEach(function(b, i){
    if (b[0] !== "sd") return;
    SD_SOUND[i] = /bell/i.test(b[2][0]) ? { kind: "bell" } : { kind: "knock", step: k++ };
  });
})();

function fireCue(bi){
  const cue = SD_SOUND[bi];
  if (!sfxOn || !cue) return;
  try {
    const c = audioCtx();
    const t = c.currentTime + 0.02;
    if (cue.kind === "bell") makeBell(c, master, t, 0.15);
    else makeKnock(c, master, t, 0.15 + cue.step * 0.035, cue.step);
  } catch(e){}
}

function startTone(){
  if (!sfxOn || tone) return;
  try { tone = makeTone(audioCtx(), master, 0.014); } catch(e){}
}

function stopTone(){
  if (!tone) return;
  try {
    const now = AC.currentTime;
    tone.gain.gain.cancelScheduledValues(now);
    tone.gain.gain.setValueAtTime(tone.gain.gain.value, now);
    tone.gain.gain.linearRampToValueAtTime(0.0001, now + 0.6);
    tone.node.stop(now + 0.7);
  } catch(e){}
  tone = null;
}

function refreshSfx(){
  sfxBtn.textContent = sfxOn ? "Sound on" : "Sound off";
  sfxBtn.classList.toggle("on", sfxOn);
}

sfxBtn.addEventListener("click", function(){
  sfxOn = !sfxOn;
  try { localStorage.setItem(SFX_STORE, sfxOn ? "1" : "0"); } catch(e){}
  if (!sfxOn) stopTone(); else if (playing) startTone();
  refreshSfx();
});

if (!IS_FINISHED){ try { if (localStorage.getItem(SFX_STORE) === "0") sfxOn = false; } catch(e){} }
refreshSfx();

/* ---------- chrome ---------- */
function showUI(sticky){
  ui.classList.remove("dim");
  statusEl.classList.remove("dim");
  clearTimeout(hideTimer);
  if (playing && !sticky) autoHide();
}
function autoHide(){
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (playing && !tapping && !recording){ ui.classList.add("dim"); statusEl.classList.add("dim"); }
  }, 2400);
}
document.addEventListener("mousemove", () => showUI(false));

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (current >= 0 && titleCard.hidden && endCard.hidden) sync(true); }, 120);
});

audio.addEventListener("ended", finish);

if (IS_FINISHED){
  // a finished piece is watched, not operated
  [recBtn, audioBtn, syncBtn, saveBtn, sfxBtn].forEach(function(b){ b.remove(); });
  document.querySelectorAll(".ui .sep").forEach(function(sep, i){ if (i === 0) sep.remove(); });
  audio.src = audio.canPlayType("audio/mpeg") ? BAKED_AUDIO : BAKED_AUDIO_ALT;
  audio.setAttribute("playsinline", "");
  hasAudio = true;
  drawTicks();
  audio.addEventListener("loadedmetadata", function(){ paintBar(); }, { once: true });
  statusEl.remove();
} else {
  syncBtn.disabled = true;
  saveBtn.disabled = true;
}
// the scene has not started, so the stage stays empty behind the title card
plate.className = "plate";
plate.innerHTML = "";
current = -1;
paintBar();
pause();
playBtn.textContent = "Play";
titleCard.hidden = false;
refreshStatus();

</script>
